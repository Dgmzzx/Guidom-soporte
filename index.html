<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soporte Guidom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-overlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-brand">Guidom<span>·</span>Soporte</div>
    <div class="auth-tagline">CONTEO DE ENTRADAS Y SALIDAS</div>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Correo electrónico" autocomplete="email" required>
      <input type="password" id="auth-password" placeholder="Contraseña" autocomplete="current-password" required>
      <div class="auth-error" id="auth-error"></div>
      <button type="submit" class="btn btn-amber" id="auth-submit">Iniciar sesión</button>
    </form>
  </div>
</div>

<script type="module" src="js/pages/login-page.js"></script>
</body>
</html>
