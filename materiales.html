<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materiales — Guidom·Soporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="brand">Guidom<span>·</span>Soporte</div>
      <div class="tagline">CONTEO DE ENTRADAS Y SALIDAS</div>
    </div>
    <button class="btn btn-ghost" id="logout-btn" style="font-size:12px;">Cerrar sesión</button>
  </header>

  <nav class="tabs">
    <a href="inventario.html" class="tab-btn">Inventario</a>
    <a href="movimientos.html" class="tab-btn">Movimientos</a>
    <a href="materiales.html" class="tab-btn active">Materiales</a>
  </nav>

  <div class="view active" id="view-materiales">
    <div class="panel">
      <h2>Nuevo material</h2>
      <div class="row">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="mat-nombre" placeholder="Ej. Tornillo 1/4">
        </div>
        <div class="field">
          <label>Categoría</label>
          <input type="text" id="mat-categoria" placeholder="Ej. Electricidad" list="cat-list">
          <datalist id="cat-list">
            <option value="Electricidad">
            <option value="Plomería">
            <option value="Ferretería">
            <option value="Herramientas">
            <option value="Pintura">
            <option value="Carpintería">
          </datalist>
        </div>
        <div class="field">
          <label>Unidad</label>
          <select id="mat-unidad">
            <option value="piezas">piezas</option>
            <option value="kg">kg</option>
            <option value="metros">metros</option>
            <option value="litros">litros</option>
            <option value="caja">caja</option>
            <option value="rollo">rollo</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="field">
          <label>Cantidad inicial</label>
          <input type="number" id="mat-cantidad" placeholder="0" min="0">
        </div>
        <div class="field">
          <label>Umbral</label>
          <input type="number" id="mat-umbral" placeholder="0" min="0">
        </div>
        <div class="field">
          <label>Ubicación</label>
          <input type="text" id="mat-ubicacion" placeholder="Ej. Estante A3">
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="field" style="flex:3;">
          <label>Observaciones</label>
          <input type="text" id="mat-observaciones" placeholder="Opcional">
        </div>
        <div class="field" style="flex:0; justify-content:flex-end;">
          <button class="btn btn-amber" id="mat-add" style="margin-top:22px;">Agregar</button>
        </div>
      </div>
    </div>

    <div class="panel" style="padding:0;">
      <h2 style="padding:18px 20px 0;">Materiales <span class="n" id="mat-count"></span></h2>
      <table>
        <thead>
          <tr>
            <th>Material</th>
            <th>Categoría</th>
            <th class="num">Cantidad</th>
            <th class="num">Umbral</th>
            <th>Ubicación</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="mat-body"></tbody>
      </table>
      <div class="empty" id="mat-empty" style="display:none;">
        <div class="big">No hay materiales</div>
        Agrega el primero con el formulario de arriba.
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <div class="modal-msg" id="modal-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
      <button class="btn btn-danger" id="modal-confirm">Eliminar</button>
    </div>
  </div>
</div>

<script type="module" src="js/pages/materials-page.js"></script>
</body>
</html>
